name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Vitest 4 requires Node 20+, while the built SDK itself supports Node 18.
      - if: matrix.node-version != 18
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package

  quality:
    name: Contracts, lint, format, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run check:version
      - run: npm run lint
      - run: npm run format:check
      # Always report every advisory, dev tooling included, without failing the build.
      # Dev tooling never reaches users; it currently reports picomatch ReDoS
      # (GHSA-fc5q-39xc-vjpf), which has no fixed version yet.
      - name: npm audit (all dependencies, informational)
        run: npm audit --audit-level=moderate || echo "::warning::npm audit reported advisories (see log). Dev-only advisories do not block."
      # Block only on advisories in what users install (the published SDK's runtime dependencies).
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=moderate
