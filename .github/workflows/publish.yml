name: Publish

# Publishes the package to npm when a GitHub release is published.
# Requires an npm "Automation" token stored as the NPM_TOKEN repository secret.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Refuse to publish if the release tag does not match package.json's version.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run check:version
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:package

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
